<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Solicitudes — Aura Eventos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="topnav-mount"></div>

<main style="max-width:1100px;margin:0 auto;padding:1.75rem 2rem">

  <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem">
    <button class="btn btn-ghost btn-sm" onclick="history.back()">← Volver</button>
    <div>
      <h1 style="font-size:1.4rem">Mis Solicitudes</h1>
      <p style="font-size:.875rem;color:var(--text3)">Historial de todas tus reservaciones</p>
    </div>
    <div style="margin-left:auto">
      <button class="btn btn-primary" onclick="window.location.href='catalogo.html'">+ Nueva Solicitud</button>
    </div>
  </div>

  <div class="stats-grid" style="margin-bottom:1.5rem" id="stats-row"></div>

  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;gap:.625rem;flex-wrap:wrap;align-items:center">
      <div style="position:relative;flex:1;min-width:180px">
        <span style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--text4)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" class="form-control" id="search-input" placeholder="Buscar por ID o artículos..." style="padding-left:2.25rem;font-size:.8125rem" oninput="renderTable()">
      </div>
      <select class="form-control" id="filter-estado" style="width:170px;font-size:.8125rem" onchange="renderTable()">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="aprobado">Aprobado</option>
        <option value="rechazado">Rechazado</option>
      </select>
      <select class="form-control" id="sort-by" style="width:170px;font-size:.8125rem" onchange="renderTable()">
        <option value="recent">Más recientes</option>
        <option value="oldest">Más antiguos</option>
        <option value="total-desc">Mayor total</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID Solicitud</th>
            <th>Artículos</th>
            <th>Fecha de Evento</th>
            <th>Total</th>
            <th>Flete</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="sol-tbody"></tbody>
      </table>
    </div>
    <div style="padding:.75rem 1.25rem;border-top:1px solid var(--border);font-size:.8125rem;color:var(--text3)" id="table-footer"></div>
  </div>
</main>

<div class="modal-overlay" id="detail-modal" style="display:none">
  <div class="modal-box modal-box-lg">
    <div class="modal-header">
      <h3 class="modal-title" id="dm-title">Detalle de Solicitud</h3>
      <button class="modal-close" onclick="closeModal('detail-modal')"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="dm-body"></div>
    <div class="modal-footer" id="dm-footer"></div>
  </div>
</div>

<div class="modal-overlay" id="remision-modal" style="display:none">
  <div class="modal-box" style="max-width:780px">
    <div class="modal-header">
      <h3 class="modal-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Nota de Remisión</h3>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-primary btn-sm" onclick="window.print()">↓ Descargar PDF</button>
        <button class="modal-close" onclick="closeModal('remision-modal')"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <div class="modal-body" id="remision-body"></div>
  </div>
</div>

<script src="../js/store.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/icons.js"></script>
  <script src="../js/layout.js"></script>
<script>

const session = Store.Auth.requireAuth('cliente');
if (!session) throw new Error('No session');

function artLabel(articulos) {
  const names = articulos.map(i => {
    const a = Store.Articulos.byId(i.artId);
    return a ? `${a.nombre}${i.cantidad > 1 ? ' x' + i.cantidad : ''}` : '?';
  });
  if (names.length <= 2) return names.join(', ');
  return names.slice(0, 2).join(', ') + ` +${names.length - 2} más`;
}

function openModal(id) {
  const m = document.getElementById(id);
  m.style.display = 'flex';
  requestAnimationFrame(() => m.classList.add('active'));
}

function closeModal(id) {
  const m = document.getElementById(id);
  m.classList.remove('active');
  setTimeout(() => { m.style.display = 'none'; }, 200);
}

function renderStats() {
  const sols = Store.Solicitudes.byCliente(session.id);
  const pend = sols.filter(s => s.estado === 'pendiente').length;
  const apro = sols.filter(s => s.estado === 'aprobado').length;
  const totalGastado = sols.filter(s => s.estado === 'aprobado').reduce((t, s) => t + s.total, 0);

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-icon" style="color:var(--warn)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="stat-value">${pend}</div><div class="stat-label">Pendientes</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--accent)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="stat-value">${apro}</div><div class="stat-label">Aprobadas</div></div>
    <div class="stat-card"><div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div>
      <div class="stat-value">${sols.length}</div><div class="stat-label">Total solicitudes</div></div>
    <div class="stat-card"><div class="stat-icon" style="color:var(--accent)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div class="stat-value" style="font-size:1.25rem">${UI.fmt.money(totalGastado)}</div><div class="stat-label">Total invertido MXN</div></div>`;
}

function renderTable() {
  const q   = document.getElementById('search-input').value.toLowerCase().trim();
  const est = document.getElementById('filter-estado').value;
  const srt = document.getElementById('sort-by').value;

  let sols = Store.Solicitudes.byCliente(session.id);
  if (q)   sols = sols.filter(s => s.id.toLowerCase().includes(q) || artLabel(s.articulos).toLowerCase().includes(q));
  if (est) sols = sols.filter(s => s.estado === est);

  if (srt === 'oldest')     sols.sort((a,b) => a.createdAt.localeCompare(b.createdAt));
  else if (srt === 'total-desc') sols.sort((a,b) => b.total - a.total);
  else sols.sort((a,b) => b.createdAt.localeCompare(a.createdAt));

  document.getElementById('table-footer').textContent =
    `Mostrando ${sols.length} de ${Store.Solicitudes.byCliente(session.id).length} solicitudes`;

  if (sols.length === 0) {
    document.getElementById('sol-tbody').innerHTML = `
      <tr><td colspan="7">
        <div class="empty-state">
          <div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
          <h3>Sin solicitudes</h3>
          <p>Aún no tienes reservaciones. <a href="catalogo.html" style="color:var(--accent)">Explora el catálogo →</a></p>
        </div>
      </td></tr>`;
    return;
  }

  document.getElementById('sol-tbody').innerHTML = sols.map(s => {
    let acciones = '';
    if (s.estado === 'aprobado') {
      acciones = `<div style="display:flex;gap:.35rem;flex-wrap:wrap">
        <button class="btn btn-sm btn-ghost" onclick="openDetail('${s.id}')">Ver detalle</button>
        <button class="btn btn-sm btn-primary" onclick="openRemision('${s.id}')">↓ PDF</button>
      </div>`;
    } else if (s.estado === 'rechazado') {
      acciones = `<button class="btn btn-sm btn-ghost" style="color:var(--danger)" onclick="openDetail('${s.id}')">Ver razón</button>`;
    } else {
      acciones = `<button class="btn btn-sm btn-ghost" onclick="openDetail('${s.id}')">Ver detalle</button>`;
    }
    return `<tr>
      <td><span style="color:var(--accent);font-weight:700;font-size:.8125rem;cursor:pointer" onclick="openDetail('${s.id}')">#${s.id}</span></td>
      <td style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.875rem;color:var(--text2)">${artLabel(s.articulos)}</td>
      <td style="font-size:.875rem;white-space:nowrap">${s.fecha ? UI.fmt.dateRange(s.fecha, s.fechaFin) : '<span style="color:var(--text4)">Sin fecha</span>'}</td>
      <td style="font-weight:700">${UI.fmt.money(s.total)}</td>
      <td style="font-size:.875rem">${s.flete != null ? UI.fmt.money(s.flete) : '<span style="color:var(--warn)">Por asignar</span>'}</td>
      <td>${UI.statusBadge(s.estado)}</td>
      <td>${acciones}</td>
    </tr>`;
  }).join('');
}

function openDetail(id) {
  const s = Store.Solicitudes.byId(id);
  if (!s) return;
  document.getElementById('dm-title').textContent = `Solicitud #${s.id}`;

  const artRows = s.articulos.map(i => {
    const a = Store.Articulos.byId(i.artId);
    return `<div style="display:flex;align-items:center;gap:.75rem;background:rgba(255,255,255,.03);padding:.625rem;border-radius:6px;margin-bottom:.4rem">
      <div style="width:40px;height:40px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0">${UI.catIcon(a?.categoria||'')}</div>
      <div style="flex:1">
        <div style="font-size:.875rem;font-weight:600">${a?.nombre||'Artículo'}</div>
        <div style="font-size:.78rem;color:var(--text3)">${a?.categoria||''} · x${i.cantidad}</div>
      </div>
      <div style="font-weight:700;color:var(--accent)">${UI.fmt.money((a?.precio||0)*i.cantidad)}</div>
    </div>`;
  }).join('');

  document.getElementById('dm-body').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
      <div>
        <div style="font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--text4);text-transform:uppercase;margin-bottom:.625rem">Detalles del Evento</div>
        <div class="review-field"><strong>Fecha</strong><span>${UI.fmt.dateRange(s.fecha, s.fechaFin)}</span></div>
        <div class="review-field"><strong>Dirección</strong><span>${s.direccion||'—'}</span></div>
        ${s.notas ? `<div class="review-field"><strong>Notas</strong><span>${s.notas}</span></div>` : ''}
        <div class="review-field" style="margin-top:.5rem"><strong>Estado</strong>${UI.statusBadge(s.estado)}</div>
        ${s.motivoRechazo ? `<div class="alert alert-error" style="margin-top:.75rem"><span class="alert-icon">⊘</span><div class="alert-content"><div class="alert-title">Motivo de rechazo</div>${s.motivoRechazo}</div></div>` : ''}
      </div>
      <div>
        <div style="font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--text4);text-transform:uppercase;margin-bottom:.625rem">Artículos Solicitados</div>
        ${artRows}
        <div style="border-top:1px solid var(--border);padding-top:.75rem;margin-top:.5rem">
          <div class="summary-row"><span>Subtotal</span><span>${UI.fmt.money(s.subtotal)}</span></div>
          <div class="summary-row"><span>IVA (16%)</span><span>${UI.fmt.money(s.iva)}</span></div>
          <div class="summary-row"><span>Flete</span><span>${s.flete != null ? UI.fmt.money(s.flete) : '<span style="color:var(--warn)">Por asignar</span>'}</span></div>
          <div class="summary-total"><span>Total</span><span>${UI.fmt.money(s.total)}</span></div>
        </div>
      </div>
    </div>`;

  document.getElementById('dm-footer').innerHTML =
    s.estado === 'aprobado'
      ? `<button class="btn btn-ghost" onclick="closeModal('detail-modal')">Cerrar</button>
         <button class="btn btn-primary" onclick="closeModal('detail-modal');openRemision('${s.id}')">↓ Descargar Nota PDF</button>`
      : `<button class="btn btn-ghost" onclick="closeModal('detail-modal')">Cerrar</button>
         <button class="btn btn-primary" onclick="window.location.href='catalogo.html'">+ Nueva solicitud</button>`;

  openModal('detail-modal');
}

function openRemision(id) {
  const s = Store.Solicitudes.byId(id);
  if (!s || s.estado !== 'aprobado') { UI.toast('Solo puedes descargar notas de solicitudes aprobadas.','warning'); return; }

  const artRows = s.articulos.map(i => {
    const a    = Store.Articulos.byId(i.artId);
    const dias = UI.fmt.days(s.fecha, s.fechaFin);
    return `<tr>
      <td><span class="remision-code">${a?.sku||i.artId}</span></td>
      <td><strong>${a?.nombre||'Artículo'}</strong><br><small style="color:#64748b">${(a?.descripcion||'').slice(0,60)}</small></td>
      <td style="text-align:center">${i.cantidad}</td>
      <td style="text-align:center">${dias}</td>
      <td style="text-align:right">${UI.fmt.money(a?.precio||0)}</td>
      <td style="text-align:right;font-weight:700">${UI.fmt.money((a?.precio||0)*i.cantidad)}</td>
    </tr>`;
  }).join('');

  const fleteRow = s.flete != null ? `<tr>
    <td><span class="remision-code">FLT-CDMX</span></td>
    <td><strong>Flete / Envío</strong><br><small style="color:#64748b">Entrega · ${s.direccion||''}</small></td>
    <td style="text-align:center">—</td><td style="text-align:center">—</td>
    <td style="text-align:right">${UI.fmt.money(s.flete)}</td>
    <td style="text-align:right;font-weight:700">${UI.fmt.money(s.flete)}</td>
  </tr>` : '';

  document.getElementById('remision-body').innerHTML = `
    <div class="remision-doc">
      <div class="remision-header">
        <div>
          <div class="remision-logo-text">AURA <span>EVENTOS</span></div>
          <div class="remision-contact">Renta de mobiliario · CDMX · contacto@aura-eventos.mx</div>
        </div>
        <div class="remision-title">
          <h2>Nota de Remisión</h2>
          <div class="remision-id">#${s.id}</div>
          <div class="remision-contact">Emisión: ${UI.fmt.date(s.createdAt)}</div>
          <span class="remision-status ${s.estado}">${s.estado.toUpperCase()}</span>
        </div>
      </div>
      <div class="remision-grid">
        <div>
          <div class="remision-section-label">Datos del Cliente</div>
          <div class="remision-field"><strong>Nombre: </strong>${session.nombre} ${session.apellidos||''}</div>
          <div class="remision-field"><strong>Teléfono: </strong>${session.telefono||'—'}</div>
          <div class="remision-field"><strong>Correo: </strong>${session.email}</div>
        </div>
        <div>
          <div class="remision-section-label">Detalles del Evento</div>
          <div class="remision-field"><strong>Fecha: </strong><strong>${UI.fmt.dateRange(s.fecha, s.fechaFin)}</strong></div>
          <div class="remision-field"><strong>Días de renta: </strong>${UI.fmt.days(s.fecha, s.fechaFin)}</div>
          <div class="remision-field"><strong>Dirección: </strong>${s.direccion||'—'}</div>
        </div>
      </div>
      <table class="remision-table">
        <thead><tr><th>Código</th><th>Descripción</th><th style="text-align:center">Cant.</th><th style="text-align:center">Días</th><th style="text-align:right">Precio</th><th style="text-align:right">Importe</th></tr></thead>
        <tbody>${artRows}${fleteRow}</tbody>
      </table>
      <div class="remision-totals">
        <div>
          <div class="remision-section-label">Notas y Condiciones</div>
          <ul class="remision-notes">
            <li>Nota de remisión preliminar. Flete estimado.</li>
            <li>Reservación sujeta a aprobación. Confirmación &lt;24h.</li>
            <li>Cancelación con menos de 72h: cargo del 50%.</li>
            <li>IVA aplica únicamente sobre valor de renta.</li>
          </ul>
        </div>
        <div class="remision-total-table">
          <div class="remision-total-row"><span>Subtotal:</span><span>${UI.fmt.money(s.subtotal)} MXN</span></div>
          <div class="remision-total-row"><span>IVA (16%):</span><span>${UI.fmt.money(s.iva)} MXN</span></div>
          ${s.flete != null ? `<div class="remision-total-row"><span>Flete:</span><span style="color:#10B981">${UI.fmt.money(s.flete)} MXN</span></div>` : ''}
          <div class="remision-total-final"><span>Total a Pagar:</span><span>${UI.fmt.money(s.total)} MXN</span></div>
        </div>
      </div>
      <div class="remision-footer">
        <div><div class="remision-sign-label">Firma del Cliente</div><div class="remision-sign-name">${session.nombre} ${session.apellidos||''}</div></div>
        <div><div class="remision-sign-label">Asesor Aura Eventos</div><div class="remision-sign-name">Por asignar</div></div>
        <div><div class="remision-sign-label">Sello Empresa</div><div class="remision-sign-name">Aura Eventos S. de R.L.</div></div>
      </div>
    </div>`;

  openModal('remision-modal');
}

['detail-modal','remision-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target.id === id) closeModal(id);
  });
});

(async () => {
  try {
    await API.init(['articulos', 'solicitudes']);
  } catch (err) { API.fatal(err); return; }
  renderTopnav('mis-solicitudes');
  UI.updateCartBadge();
  renderStats();
  renderTable();
})();

</script>
</body>
</html>
